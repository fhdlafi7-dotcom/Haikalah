<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>أداة التصميم التفاعلية</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 { color: #333; margin-bottom: 15px; text-align: center; }
        
        /* تخطيط الصفحة: الأدوات يمين، ومساحة العمل يسار */
        .workspace-container {
            display: flex;
            flex-direction: row-reverse; /* يجعل اليمين للأدوات واليسار لمساحة العمل */
            gap: 20px;
            align-items: flex-start;
        }

        /* لوحة التحكم والأدوات (في اليمين) */
        .toolbar {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 220px;
        }
        .toolbar h3 {
            margin: 0 0 5px 0;
            font-size: 15px;
            color: #2c3e50;
            border-bottom: 2px solid #eee;
            padding-bottom: 5px;
        }
        button {
            padding: 9px 15px;
            cursor: pointer;
            border: 1px solid #ccc;
            background: #fff;
            border-radius: 4px;
            font-size: 14px;
            text-align: right;
            transition: 0.2s;
        }
        button:hover { background: #e9ecef; border-color: #999; }
        
        /* مساحة العمل (الكانفاس - في اليسار) */
        #canvas {
            width: 800px;
            height: 500px;
            background: #fff;
            border: 2px solid #ccc;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        /* العناصر القابلة للسحب */
        .canvas-element {
            position: absolute;
            cursor: move;
            user-select: none;
        }
        
        /* تحديد العنصر النشط */
        .canvas-element.selected {
            outline: 2px dashed #e74c3c;
            box-shadow: 0 0 10px rgba(231, 76, 60, 0.3);
        }

        /* تصميم المربع */
        .box-element {
            width: 150px;
            height: 100px;
            background-color: rgba(52, 152, 219, 0.6);
            border: 2px solid #2980b9;
            resize: both;
            overflow: hidden;
        }

        /* تصميم النص */
        .text-element {
            width: 200px;
            height: 80px;
            background: transparent;
            resize: both;
            overflow: hidden;
        }

        /* حقل النص الداعم لـ Enter */
        .text-element textarea {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            resize: none;
            font-size: 18px;
            color: #000;
            outline: none;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }

        /* خطوط المحاذاة الوهمية */
        .guide-line-v {
            position: absolute;
            top: 0; bottom: 0; width: 1px;
            background-color: #e74c3c;
            z-index: 9999; display: none; pointer-events: none;
        }
        .guide-line-h {
            position: absolute;
            left: 0; right: 0; height: 1px;
            background-color: #e74c3c;
            z-index: 9999; display: none; pointer-events: none;
        }
    </style>
</head>
<body>

    <h2>أداة التصميم التفاعلية</h2>
    
    <div class="workspace-container">
        
        <!-- أدوات التحكم والمدخلات (في اليمين) -->
        <div class="toolbar">
            <h3>إضافة عناصر</h3>
            <button onclick="addBox()">+ إضافة مربع</button>
            <button onclick="addText()">+ إضافة نص</button>
            
            <h3>ترتيب الطبقات</h3>
            <button onclick="bringToFront()">▲ إحضار للمقدمة (فوق)</button>
            <button onclick="sendToBack()">▼ إرسال للخلف (تحت)</button>
            
            <h3>خصائص الشكل</h3>
            <button onclick="changeBorder('solid')">إطار متصل</button>
            <button onclick="changeBorder('dashed')">إطار مقطع (Dashed)</button>
        </div>

        <!-- مساحة العمل (في اليسار) -->
        <div id="canvas">
            <div id="guideV" class="guide-line-v"></div>
            <div id="guideH" class="guide-line-h"></div>
        </div>

    </div>

<script>
    const canvas = document.getElementById('canvas');
    const guideV = document.getElementById('guideV');
    const guideH = document.getElementById('guideH');
    let selectedElement = null;
    let zIndexCounter = 1;

    // إضافة مربع مستقل
    function addBox() {
        const box = document.createElement('div');
        box.classList.add('canvas-element', 'box-element');
        box.style.left = '50px';
        box.style.top = '50px';
        box.style.zIndex = zIndexCounter++;
        setupElement(box);
    }

    // إضافة نص مستقل يدعم Enter
    function addText() {
        const textWrapper = document.createElement('div');
        textWrapper.classList.add('canvas-element', 'text-element');
        textWrapper.style.left = '100px';
        textWrapper.style.top = '150px';
        textWrapper.style.zIndex = zIndexCounter++;

        const textarea = document.createElement('textarea');
        textarea.placeholder = 'اكتب نصك هنا...';
        textWrapper.appendChild(textarea);
        
        setupElement(textWrapper);
    }

    function setupElement(el) {
        el.addEventListener('mousedown', () => selectElement(el));
        makeDraggable(el);
        canvas.appendChild(el);
        selectElement(el);
    }

    function selectElement(el) {
        document.querySelectorAll('.canvas-element').forEach(b => b.classList.remove('selected'));
        el.classList.add('selected');
        selectedElement = el;
    }

    // التحكم بالطبقات
    function bringToFront() {
        if (selectedElement) {
            selectedElement.style.zIndex = zIndexCounter++;
        }
    }
    function sendToBack() {
        if (selectedElement) {
            selectedElement.style.zIndex = 0;
        }
    }

    // تغيير شكل الإطار للمربع
    function changeBorder(type) {
        if (selectedElement && selectedElement.classList.contains('box-element')) {
            if (type === 'dashed') {
                selectedElement.style.border = '2px dashed #2980b9';
            } else {
                selectedElement.style.border = '2px solid #2980b9';
            }
        }
    }

    // وظيفة السحب والمحاذاة الوهمية من الجانبين ومن فوق/تحت
    function makeDraggable(elmnt) {
        let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
        elmnt.onmousedown = dragMouseDown;

        function dragMouseDown(e) {
            if (e.target.tagName === 'TEXTAREA') return; // السماح بالكتابة بلا تقاطع مع السحب
            e.preventDefault();
            pos3 = e.clientX;
            pos4 = e.clientY;
            document.onmouseup = closeDragElement;
            document.onmousemove = elementDrag;
        }

        function elementDrag(e) {
            e.preventDefault();
            pos1 = pos3 - e.clientX;
            pos2 = pos4 - e.clientY;
            pos3 = e.clientX;
            pos4 = e.clientY;

            let newLeft = elmnt.offsetLeft - pos1;
            let newTop = elmnt.offsetTop - pos2;

            let allElements = document.querySelectorAll('.canvas-element');
            let snapThreshold = 6;
            let showV = false, showH = false;

            allElements.forEach(other => {
                if (other === elmnt) return;
                
                let oRect = other.getBoundingClientRect();
                let cRect = canvas.getBoundingClientRect();
                
                let oLeft = oRect.left - cRect.left;
                let oTop = oRect.top - cRect.top;
                let oRight = oLeft + other.offsetWidth;
                let oBottom = oTop + other.offsetHeight;

                // المحاذاة الأفقية (من الجانبين)
                if (Math.abs(newLeft - oLeft) < snapThreshold) {
                    newLeft = oLeft; guideV.style.left = newLeft + 'px'; showV = true;
                }
                if (Math.abs((newLeft + elmnt.offsetWidth) - oRight) < snapThreshold) {
                    newLeft = oRight - elmnt.offsetWidth; guideV.style.left = (newLeft + elmnt.offsetWidth) + 'px'; showV = true;
                }

                // المحاذاة الرأسية (من فوق وتحت)
                if (Math.abs(newTop - oTop) < snapThreshold) {
                    newTop = oTop; guideH.style.top = newTop + 'px'; showH = true;
                }
                if (Math.abs((newTop + elmnt.offsetHeight) - oBottom) < snapThreshold) {
                    newTop = oBottom - elmnt.offsetHeight; guideH.style.top = (newTop + elmnt.offsetHeight) + 'px'; showH = true;
                }
            });

            guideV.style.display = showV ? 'block' : 'none';
            guideH.style.display = showH ? 'block' : 'none';

            elmnt.style.left = newLeft + "px";
            elmnt.style.top = newTop + "px";
        }

        function closeDragElement() {
            document.onmouseup = null;
            document.onmousemove = null;
            guideV.style.display = 'none';
            guideH.style.display = 'none';
        }
    }
</script>

</body>
</html>
