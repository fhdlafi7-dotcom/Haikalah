<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>أداة التصميم الهيكلي</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 { color: #333; margin-bottom: 15px; }
        
        .main-container {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1100px;
            justify-content: center;
        }

        /* لوحة التحكم والمدخلات (في اليمين) */
        .sidebar {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .control-group label {
            font-weight: bold;
            font-size: 13px;
            color: #555;
        }

        input, select, button {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        button {
            background: #3498db;
            color: #fff;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        button:hover { background: #2980b9; }
        
        .btn-secondary { background: #95a5a6; }
        .btn-secondary:hover { background: #7f8c8d; }

        /* صفحة العمل (اليسار) */
        #canvas {
            width: 700px;
            height: 500px;
            background: #fff;
            border: 2px solid #ccc;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .element {
            position: absolute;
            cursor: move;
            user-select: none;
        }

        .element.selected {
            outline: 2px dashed #e74c3c;
        }
    </style>
</head>
<body>

    <h2>أداة التصميم الهيكلي</h2>
    
    <div class="main-container">
        
        <!-- مساحة العمل (في اليسار) -->
        <div id="canvas"></div>

        <!-- أدوات التحكم والمدخلات (في اليمين) -->
        <div class="sidebar">
            <div class="control-group">
                <label>إضافة عنصر جديد:</label>
                <button onclick="addElement('text')">+ إضافة نص</button>
                <button onclick="addElement('box')">+ إضافة مربع</button>
            </div>

            <hr style="width:100%; border:0; border-top:1px solid #eee;">

            <div class="control-group">
                <label>محتوى النص:</label>
                <input type="text" id="textContent" placeholder="اكتب النص هنا..." oninput="updateSelectedText()">
            </div>

            <div class="control-group">
                <label>رفع صورة:</label>
                <input type="file" id="imageLoader" accept="image/*" onchange="uploadImage(event)">
            </div>

            <div class="control-group">
                <label>التحكم بالشفافية:</label>
                <input type="range" id="opacityRange" min="0.1" max="1" step="0.1" value="1" oninput="updateOpacity()">
            </div>

            <hr style="width:100%; border:0; border-top:1px solid #eee;">

            <div class="control-group">
                <button onclick="saveProject()" class="btn-secondary">حفظ المشروع</button>
                <button onclick="exportPDF()" class="btn-secondary">تصدير PDF</button>
            </div>
        </div>

    </div>

<script>
    const canvas = document.getElementById('canvas');
    let selectedElement = null;

    // إضافة عناصر (نص أو مربع)
    function addElement(type) {
        const el = document.createElement('div');
        el.classList.add('element');
        el.style.left = '50px';
        el.style.top = '50px';

        if (type === 'text') {
            el.innerText = 'نص جديد';
            el.style.fontSize = '18px';
            el.style.fontWeight = 'bold';
            el.dataset.type = 'text';
        } else if (type === 'box') {
            el.style.width = '150px';
            el.style.height = '100px';
            el.style.backgroundColor = 'rgba(52, 152, 219, 0.5)';
            el.style.border = '2px solid #2980b9';
            el.dataset.type = 'box';
        }

        makeDraggable(el);
        el.addEventListener('mousedown', () => selectEl(el));
        
        canvas.appendChild(el);
        selectEl(el);
    }

    function selectEl(el) {
        document.querySelectorAll('.element').forEach(e => e.classList.remove('selected'));
        el.classList.add('selected');
        selectedElement = el;

        if (el.dataset.type === 'text') {
            document.getElementById('textContent').value = el.innerText;
        }
        document.getElementById('opacityRange').value = el.style.opacity || 1;
    }

    function updateSelectedText() {
        if (selectedElement && selectedElement.dataset.type === 'text') {
            selectedElement.innerText = document.getElementById('textContent').value;
        }
    }

    function updateOpacity() {
        if (selectedElement) {
            selectedElement.style.opacity = document.getElementById('opacityRange').value;
        }
    }

    function uploadImage(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(event) {
            const img = document.createElement('img');
            img.src = event.target.result;
            img.style.width = '120px';
            img.style.height = 'auto';
            img.classList.add('element');
            img.style.left = '80px';
            img.style.top = '80px';
            img.dataset.type = 'image';

            makeDraggable(img);
            img.addEventListener('mousedown', () => selectEl(img));
            canvas.appendChild(img);
            selectEl(img);
        }
        reader.readAsDataURL(file);
    }

    function saveProject() {
        alert('تم حفظ المشروع بنجاح!');
    }

    function exportPDF() {
        alert('جاري تجهيز ملف الـ PDF للتصدير...');
    }

    // خاصية السحب والإفلات البسيطة للعناصر داخل مساحة العمل
    function makeDraggable(elmnt) {
        let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
        elmnt.onmousedown = dragMouseDown;

        function dragMouseDown(e) {
            e.preventDefault();
            pos3 = e.clientX;
            pos4 = e.clientY;
            document.onmouseup = closeDragElement;
            document.onmousemove = elementDrag;
        }

        function elementDrag(e) {
            e.preventDefault();
            pos1 = pos3 - e.clientX;
            pos2 = pos4 - e.clientY;
            pos3 = e.clientX;
            pos4 = e.clientY;
            elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
            elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
        }

        function closeDragElement() {
            document.onmouseup = null;
            document.onmousemove = null;
        }
    }
</script>

</body>
</html>
