<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>أداة التصميم التفاعلية</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 { color: #333; margin-bottom: 10px; }
        .toolbar {
            background: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button, select {
            padding: 8px 15px;
            cursor: pointer;
            border: 1px solid #ccc;
            background: #fff;
            border-radius: 4px;
            font-size: 14px;
        }
        button:hover { background: #e9ecef; }
        
        /* مساحة العمل (الكانفاس) */
        #canvas {
            width: 800px;
            height: 500px;
            background: #fff;
            border: 2px solid #ccc;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        /* العناصر القابلة للسحب */
        .box-element {
            position: absolute;
            width: 150px;
            height: 100px;
            background-color: rgba(52, 152, 219, 0.6);
            border: 2px solid #2980b9;
            cursor: move;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            resize: both;
            overflow: hidden;
        }
        .box-element.selected {
            border-color: #e74c3c;
            box-shadow: 0 0 10px rgba(231, 76, 60, 0.5);
        }

        /* حقل النص داخل الشكل الداعم للأسطر المتعددة */
        .box-element textarea {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            resize: none;
            text-align: center;
            font-size: 16px;
            color: #fff;
            outline: none;
            font-family: Arial, sans-serif;
        }

        /* خطوط المحاذاة الوهمية */
        .guide-line-v {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 1px;
            background-color: #e74c3c;
            z-index: 9999;
            pointer-events: none;
            display: none;
        }
        .guide-line-h {
            position: absolute;
            left: 0;
            right: 0;
            height: 1px;
            background-color: #e74c3c;
            z-index: 9999;
            pointer-events: none;
            display: none;
        }
    </style>
</head>
<body>

    <h2>أداة تصميم المربعات والنصوص</h2>
    
    <div class="toolbar">
        <button onclick="addBox()">إضافة شكل/مربع جديد</button>
        <button onclick="changeBorder('solid')">إطار متصل</button>
        <button onclick="changeBorder('dashed')">إطار مقطع (Dashed)</button>
        <button onclick="bringToFront()">إحضار للمقدمة (طبقة فوق)</button>
        <button onclick="sendToBack()">إرسال للخلف (طبقة تحت)</button>
    </div>

    <!-- مساحة العمل -->
    <div id="canvas">
        <!-- خطوط المحاذاة الوهمية -->
        <div id="guideV" class="guide-line-v"></div>
        <div id="guideH" class="guide-line-h"></div>
    </div>

<script>
    const canvas = document.getElementById('canvas');
    const guideV = document.getElementById('guideV');
    const guideH = document.getElementById('guideH');
    let selectedBox = null;
    let zIndexCounter = 1;

    // إضافة مربع جديد
    function addBox() {
        const box = document.createElement('div');
        box.classList.add('box-element');
        box.style.left = '50px';
        box.style.top = '50px';
        box.style.zIndex = zIndexCounter++;

        // إضافة textarea لدعم كتابة النصوص والنزول لسطر جديد بـ Enter
        const textarea = document.createElement('textarea');
        textarea.placeholder = 'اكتب هنا...';
        box.appendChild(textarea);

        // جعل العنصر قابلاً للسحب (Drag & Drop) مع خطوط المحاذاة
        makeDraggable(box);

        // تحديد العنصر عند النقر عليه
        box.addEventListener('mousedown', (e) => {
            selectBox(box);
        });

        canvas.appendChild(box);
        selectBox(box);
    }

    function selectBox(box) {
        document.querySelectorAll('.box-element').forEach(b => b.classList.remove('selected'));
        box.classList.add('selected');
        selectedBox = box;
    }

    // إحضار للمقدمة
    function bringToFront() {
        if (selectedBox) {
            selectedBox.style.zIndex = zIndexCounter++;
        }
    }

    // إرسال للخلف
    function sendToBack() {
        if (selectedBox) {
            selectedBox.style.zIndex = 0;
        }
    }

    // تغيير نوع الإطار (متصل أو مقطع)
    function changeBorder(type) {
        if (selectedBox) {
            if (type === 'dashed') {
                selectedBox.style.border = '2px dashed #2980b9';
            } else {
                selectedBox.style.border = '2px solid #2980b9';
            }
        }
    }

    // وظيفة السحب والإفلات مع المحاذاة الوهمية (Smart Guides)
    function makeDraggable(elmnt) {
        let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;

        elmnt.onmousedown = dragMouseDown;

        function dragMouseDown(e) {
            // تجاهل السحب إذا كان النقر داخل الـ textarea لتسهيل الكتابة وتحديد النص
            if (e.target.tagName === 'TEXTAREA') return;
            
            e.preventDefault();
            pos3 = e.clientX;
            pos4 = e.clientY;
            document.onmouseup = closeDragElement;
            document.onmousemove = elementDrag;
        }

        function elementDrag(e) {
            e.preventDefault();
            pos1 = pos3 - e.clientX;
            pos2 = pos4 - e.clientY;
            pos3 = e.clientX;
            pos4 = e.clientY;

            let newLeft = elmnt.offsetLeft - pos1;
            let newTop = elmnt.offsetTop - pos2;

            // نظام خطوط المحاذاة الوهمية (Snapping & Guides)
            let boxes = document.querySelectorAll('.box-element');
            let snapThreshold = 6; // مسافة التجاذب
            let showV = false;
            let showH = false;

            boxes.forEach(other => {
                if (other === elmnt) return;

                let oRect = other.getBoundingClientRect();
                let cRect = canvas.getBoundingClientRect();
                
                let oLeft = oRect.left - cRect.left;
                let oTop = oRect.top - cRect.top;
                let oRight = oLeft + other.offsetWidth;
                let oBottom = oTop + other.offsetHeight;

                // محاذاة الحواف اليمنى واليسرى (من الجانبين)
                if (Math.abs(newLeft - oLeft) < snapThreshold) {
                    newLeft = oLeft;
                    guideV.style.left = newLeft + 'px';
                    showV = true;
                }
                if (Math.abs((newLeft + elmnt.offsetWidth) - oRight) < snapThreshold) {
                    newLeft = oRight - elmnt.offsetWidth;
                    guideV.style.left = (newLeft + elmnt.offsetWidth) + 'px';
                    showV = true;
                }

                // محاذاة الحواف العليا والسفلى (من فوق وتحت)
                if (Math.abs(newTop - oTop) < snapThreshold) {
                    newTop = oTop;
                    guideH.style.top = newTop + 'px';
                    showH = true;
                }
                if (Math.abs((newTop + elmnt.offsetHeight) - oBottom) < snapThreshold) {
                    newTop = oBottom - elmnt.offsetHeight;
                    guideH.style.top = (newTop + elmnt.offsetHeight) + 'px';
                    showH = true;
                }
            });

            // إظهار أو إخفاء الخطوط الوهمية
            guideV.style.display = showV ? 'block' : 'none';
            guideH.style.display = showH ? 'block' : 'none';

            // تطبيق الموقع الجديد على العنصر
            elmnt.style.left = newLeft + "px";
            elmnt.style.top = newTop + "px";
        }

        function closeDragElement() {
            document.onmouseup = null;
            document.onmousemove = null;
            guideV.style.display = 'none';
            guideH.style.display = 'none';
        }
    }
</script>

</body>
</html>
